  <script>
    // Reading progress bar
    const progressBar = document.getElementById('progressBar');
    function updateProgress() {
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      progressBar.style.width = pct + '%';
    }
    window.addEventListener('scroll', updateProgress, { passive: true });

    async function loadArticle() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id') || 'xiaoyao-you';
      try {
        const resp = await fetch(`data/${id}.json`);
        if (!resp.ok) { document.getElementById('hero-title').textContent = '文章未找到'; return; }
        const data = await resp.json();
        renderArticle(data);
      } catch (e) {
        document.getElementById('hero-title').textContent = '加载失败';
        console.error(e);
      }
    }

    function renderArticle(data) {
      document.getElementById('hero-label').textContent = data.label || '';
      document.getElementById('hero-title').textContent = data.title || '';
      document.getElementById('hero-subtitle').textContent = data.subtitle || '';

      if (data.bgChar) {
        const hero = document.getElementById('hero');
        const after = document.createElement('div');
        after.style.cssText = `
          position: absolute; right: -5%; top: 50%;
          transform: translateY(-50%);
          font-family: "ZCOOL XiaoWei", serif;
          font-size: 38vw; color: var(--ink); opacity: 0.018;
          line-height: 1; pointer-events: none; user-select: none;
          letter-spacing: -0.05em;
        `;
        after.textContent = data.bgChar;
        hero.appendChild(after);
      }

      let origHTML = '';
      let noteHTML = '';

      (data.blocks || []).forEach((block, i) => {
        const rubyHTML = block.ruby || block.orig;
        origHTML += `
        <div class="orig-block" data-reveal id="orig-${i}">
          <div class="orig-block-num">${block.num}</div>
          <div class="orig-block-text">${block.orig}</div>
          <div class="orig-ruby" style="display:none">${rubyHTML}</div>
        </div>`;
        noteHTML += `
        <div class="note-block" data-reveal id="note-${i}" data-target="orig-${i}">
          <div class="note-block-num">${block.num}</div>
          <div class="note-block-text"><p>${block.note || ''}</p></div>
        </div>`;
      });

      if (data.coreQuote) {
        origHTML += `
        <div class="core-quote" data-reveal>
          <blockquote>${data.coreQuote.replace(/；/g, '<br>')}</blockquote>
          <cite>——${data.title}</cite>
        </div>`;
      }

      if (data.comparison && data.comparison.length > 0) {
        let rows = '';
        data.comparison.forEach(row => {
          rows += `<tr><td class="row-label">${row.label}</td><td>${row.left}</td><td>${row.right}</td></tr>`;
        });
        origHTML += `
        <div class="comparison-section" data-reveal>
          <div class="comparison-label">对照</div>
          <table>
            <thead><tr><th style="width:90px;"></th><th></th><th></th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
      }

      document.getElementById('orig-col').innerHTML = origHTML;
      document.getElementById('note-col').innerHTML = '<div class="note-col-header">注释</div>' + noteHTML;

      document.querySelectorAll('.float-nav-item').forEach(a => {
        if (a.getAttribute('href') === `article.html?id=${data.id}`) a.classList.add('active');
      });

      // Expose blocks for audio controller
      window.__articleBlocks = data.blocks || [];

      observeReveal();
      updateProgress();
    }

    function observeReveal() {
      // Scroll reveal animation
      const revealObs = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) entry.target.classList.add('visible');
        });
      }, { threshold: 0.08 });
      document.querySelectorAll('[data-reveal]').forEach(el => revealObs.observe(el));

      // Scroll spy: highlight note block when corresponding orig block is in view
      const origBlocks = document.querySelectorAll('.orig-block[id]');
      const noteBlocks = document.querySelectorAll('.note-block[data-target]');

      const spyObs = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.id;
            noteBlocks.forEach(nb => {
              if (nb.getAttribute('data-target') === id) {
                nb.classList.add('active');
              } else {
                nb.classList.remove('active');
              }
            });
          }
        });
      }, { threshold: 0.3, rootMargin: '-10% 0px -60% 0px' });

      origBlocks.forEach(el => spyObs.observe(el));
    }

    let pinyinVisible = false;
    function togglePinyin() {
      pinyinVisible = !pinyinVisible;
      document.querySelectorAll('.orig-ruby').forEach(el => {
        el.style.display = pinyinVisible ? 'block' : 'none';
      });
      document.querySelectorAll('.orig-block-text').forEach(el => {
        el.style.display = pinyinVisible ? 'none' : 'block';
      });
      document.getElementById('pinyinToggleLabel').textContent = pinyinVisible ? '隐藏拼音' : '显示拼音';
      document.getElementById('pinyinToggle').classList.toggle('active', pinyinVisible);
    }

    // ── Audio / TTS ──────────────────────────────────────────
    let audioController = null;

    function toggleAudio() {
      if (!audioController) {
        const blocks = window.__articleBlocks || [];
        if (!blocks.length) return;
        audioController = new AudioController(blocks);
        audioController.onEnd = () => stopAudio();
        audioController.onBlockChange = (i, total) => {
          document.getElementById('audioBlockNum').textContent = `${i + 1} / ${total}`;
          document.getElementById('audioProgressFill').style.width =
            ((i + 1) / total * 100) + '%';
        };
        audioController.start();
      }
      if (audioController.isPlaying()) {
        audioController.pause();
      } else {
        audioController.resume();
      }
    }

    function stopAudio() {
      if (audioController) {
        audioController.stop();
        audioController = null;
      }
      document.getElementById('audioProgress').style.display = 'none';
      document.getElementById('audioToggle').classList.remove('playing');
      document.getElementById('audioToggleLabel').textContent = '朗读';
      document.getElementById('audioIcon').innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>';
    }

    class AudioController {
      constructor(blocks) {
        this.blocks = blocks; // [{pinyin, orig}]
        this.synth = window.speechSynthesis;
        this.queue = [];
        this.currentIndex = 0;
        this.paused = false;
        this.utterance = null;
        this._boundEnd = this._onEnd.bind(this);
      }

      isPlaying() {
        return this.synth.speaking && !this.paused;
      }

      start() {
        // Show progress bar
        document.getElementById('audioProgress').style.display = 'flex';
        document.getElementById('audioToggle').classList.add('playing');
        document.getElementById('audioToggleLabel').textContent = '暂停';
        document.getElementById('audioIcon').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        this._speakNext();
      }

      _speakNext() {
        if (this.currentIndex >= this.blocks.length) {
          this._cleanup();
          if (this.onEnd) this.onEnd();
          return;
        }
        const block = this.blocks[this.currentIndex];
        const text = block.pinyin || block.orig;

        // Highlight current block
        document.querySelectorAll('.orig-block').forEach((el, i) => el.classList.remove('audio-active'));
        const currentEl = document.getElementById(`orig-${this.currentIndex}`);
        if (currentEl) {
          currentEl.classList.add('audio-active');
          currentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        if (this.onBlockChange) this.onBlockChange(this.currentIndex, this.blocks.length);

        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = 'zh-CN';
        utt.rate = 0.85;
        utt.pitch = 1.0;
        // Try to pick a Chinese voice
        const voices = this.synth.getVoices();
        const zhVoice = voices.find(v => v.lang.startsWith('zh'));
        if (zhVoice) utt.voice = zhVoice;

        utt.onend = this._boundEnd;
        utt.onerror = this._boundEnd;
        this.utterance = utt;
        this.synth.speak(utt);
      }

      _onEnd() {
        if (this.paused) return;
        this.currentIndex++;
        this._speakNext();
      }

      pause() {
        this.paused = true;
        this.synth.pause();
        document.getElementById('audioToggleLabel').textContent = '继续';
        document.getElementById('audioIcon').innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
      }

      resume() {
        this.paused = false;
        this.synth.resume();
        document.getElementById('audioToggleLabel').textContent = '暂停';
        document.getElementById('audioIcon').innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
      }

      stop() {
        this._cleanup();
        this.synth.cancel();
      }

      _cleanup() {
        document.querySelectorAll('.orig-block').forEach(el => el.classList.remove('audio-active'));
      }
    }

    // Pre-load voices (needed for Chrome)
    if (window.speechSynthesis) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    loadArticle();
  </script>
